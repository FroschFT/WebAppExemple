<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title description">
  <title id="title">Nova hovering companion robot</title>
  <desc id="description">A friendly white hovering robot with a dark glass visor, cyan eyes, and an amber Nova emblem.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07171c"/>
      <stop offset="0.52" stop-color="#12343b"/>
      <stop offset="1" stop-color="#16272c"/>
    </linearGradient>
    <linearGradient id="wall-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9eeaf0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#9eeaf0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shell" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e9eef0"/>
      <stop offset="1" stop-color="#aebbc0"/>
    </linearGradient>
    <linearGradient id="shell-shadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dce5e7"/>
      <stop offset="1" stop-color="#82949a"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#152b31"/>
      <stop offset="0.45" stop-color="#030b0e"/>
      <stop offset="1" stop-color="#0c1e23"/>
    </linearGradient>
    <linearGradient id="chest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52666b"/>
      <stop offset="1" stop-color="#25373c"/>
    </linearGradient>
    <radialGradient id="hover-light">
      <stop offset="0" stop-color="#62edf2" stop-opacity="0.72"/>
      <stop offset="0.45" stop-color="#39cbd3" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#39cbd3" stop-opacity="0"/>
    </radialGradient>
    <filter id="cyan-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="robot-shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#02090b" flood-opacity="0.58"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#background)"/>
  <path d="M0 0h800v170C674 139 532 124 400 124S126 139 0 170V0z" fill="url(#wall-light)"/>
  <g fill="none" stroke="#a7dce0" stroke-opacity="0.12" stroke-width="2">
    <path d="M0 184h800M0 678h800"/>
    <path d="M102 0v800M698 0v800"/>
    <path d="M102 184l94 74M698 184l-94 74M102 678l94-74M698 678l-94-74"/>
  </g>
  <g fill="#9bdce0" opacity="0.3">
    <rect x="28" y="211" width="8" height="66" rx="4"/>
    <rect x="764" y="211" width="8" height="66" rx="4"/>
    <rect x="28" y="523" width="8" height="66" rx="4"/>
    <rect x="764" y="523" width="8" height="66" rx="4"/>
  </g>

  <ellipse cx="400" cy="716" rx="205" ry="72" fill="url(#hover-light)"/>
  <ellipse cx="400" cy="716" rx="112" ry="20" fill="none" stroke="#67eaf0" stroke-opacity="0.5" stroke-width="3"/>

  <g filter="url(#robot-shadow)">
    <path d="M275 381c0-58 47-105 105-105h40c58 0 105 47 105 105v192c0 69-27 121-79 160-27 20-65 20-92 0-52-39-79-91-79-160V381z" fill="url(#shell)"/>
    <path d="M301 474c25 17 58 26 99 26s74-9 99-26v104c0 54-22 96-65 127-20 15-48 15-68 0-43-31-65-73-65-127V474z" fill="#dce4e6"/>
    <path d="M327 491c20 8 44 12 73 12s53-4 73-12v110c0 35-17 67-47 89-15 11-37 11-52 0-30-22-47-54-47-89V491z" fill="url(#chest)"/>
    <path d="M302 591c22 9 54 14 98 14s76-5 98-14c-3 45-24 82-64 112-20 15-48 15-68 0-40-30-61-67-64-112z" fill="url(#shell-shadow)"/>
    <path d="M390 701h20l-4 34h-12l-4-34z" fill="#6ce8ed" opacity="0.75"/>

    <g transform="translate(72 58) scale(0.82)">
      <path d="M211 303c0-105 85-190 189-190s189 85 189 190v56c0 80-65 145-145 145h-88c-80 0-145-65-145-145v-56z" fill="url(#shell)"/>
      <path d="M247 293c0-71 58-129 129-129h48c71 0 129 58 129 129v55c0 61-49 110-110 110h-86c-61 0-110-49-110-110v-55z" fill="url(#visor)"/>
      <path d="M274 264c23-53 65-79 126-79 61 0 103 26 126 79-36-27-78-40-126-40s-90 13-126 40z" fill="#5a747b" opacity="0.2"/>
      <path d="M230 369c11 48 46 86 91 103-29-20-47-55-47-94v-70c0-91 60-162 146-189h-20c-104 0-189 85-189 190v50c0 3 0 7 1 10h18z" fill="#ffffff" opacity="0.3"/>

      <g fill="none" stroke="#72f4f5" stroke-linecap="round" stroke-width="18" filter="url(#cyan-glow)">
        <path d="M300 326c24 20 52 20 76 0"/>
        <path d="M424 326c24 20 52 20 76 0"/>
      </g>
      <path d="M382 394c11 8 25 8 36 0" fill="none" stroke="#4acdd3" stroke-linecap="round" stroke-opacity="0.7" stroke-width="7"/>
      <path d="M516 199c18 17 29 39 34 66" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-opacity="0.68" stroke-width="8"/>
      <path d="M268 207c-17 19-27 41-30 67" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-opacity="0.4" stroke-width="5"/>
    </g>

    <circle cx="400" cy="550" r="35" fill="#192c31" stroke="#819398" stroke-width="4"/>
    <path d="M365 550h70" fill="none" stroke="#f4b942" stroke-linecap="round" stroke-width="5"/>
    <circle cx="400" cy="550" r="10" fill="#f4b942"/>
    <circle cx="400" cy="550" r="45" fill="none" stroke="#f4b942" stroke-opacity="0.3" stroke-width="2"/>

    <path d="M521 444l18 13" fill="none" stroke="#f4b942" stroke-linecap="round" stroke-width="8"/>
  </g>

  <g fill="#b5edf0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="3" opacity="0.55">
    <text x="47" y="753">NOVA // ONLINE</text>
    <text x="633" y="753">N-07</text>
  </g>
</svg>
